name: Validate PowerShell Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\rustdesk-switcher.ps1", [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
          Write-Host 'Syntax OK'
